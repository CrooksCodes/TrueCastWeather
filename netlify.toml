[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — not strictly needed for this app (single index.html, no client
# router), but harmless and future-proofs if routes are added later.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
